version: '3.8'

services:
  # MySQL Database Service
  db:
    image: mysql:8.0
    container_name: defect_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: Autonomus_defect
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Python YOLOv8 AI Microservice
  ai_service:
    build:
      context: ./ai_service
      dockerfile: Dockerfile
    container_name: defect_ai_service
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./ai_service/detected_images:/app/detected_images

  # Spring Boot REST API Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: defect_backend
    restart: always
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/Autonomus_defect?useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      AI_SERVICE_URL: http://ai_service:8000
    depends_on:
      db:
        condition: service_healthy
      ai_service:
        condition: service_started

  # React Operator Dashboard Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: defect_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mysql_data:
