# Server Port Configuration
server.port=8081

# Database Configuration (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/Autonomus_defect
spring.datasource.username=root
spring.datasource.password=123456789
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configurations
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# SQL Schema Initialization (Runs schema.sql if database is empty)
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# AI Python YOLOv8 Service Configuration
ai.service.url=http://localhost:8000

# Admin Credentials for Inspection Deletion
admin.username=admin
admin.password=admin123

