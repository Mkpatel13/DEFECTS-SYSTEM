# Server Port Configuration
server.port=${PORT:8081}

# Database Configuration (MySQL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/Autonomus_defect}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=MeetV
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configurations
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# SQL Schema Initialization (Runs schema.sql if database is empty)
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# AI Python YOLOv8 Service Configuration
ai.service.url=${AI_SERVICE_URL:http://localhost:8000}

# Admin Credentials for Inspection Deletion
admin.username=${ADMIN_USERNAME:admin}
admin.password=${ADMIN_PASSWORD:admin123}


